  products: [],
  currentCategoryId: 'power',
  currentKindKey: '',

  readOnly: false,

// ==================== 初始化 ====================
function init() {
  const saved = sessionStorage.getItem('krn_admin_login');
  if (saved === '1') state.loggedIn = true;
  render();
  if (state.loggedIn) loadData();
}

async function loadData() {
  state.loading = true;
  state.readOnly = false;
  render();
  // 若 SDK 使用 defer 加载，可能此时 window.supabase 还未就绪，需要等待
  if (!_supabaseClient) {
    for (let i = 0; i < 30; i++) { // 最多等 3 秒
      await new Promise(r => setTimeout(r, 100));
      if (initSupabaseClient()) break;
      if (window.__supabaseLoadFailed) break;
    }
  }
  if (!_supabaseClient) {
    const reason = window.__supabaseLoadFailed ? 'CDN 加载失败' : 'SDK 加载超时';
    showMessage('Supabase 未就绪（' + reason + '），后台不可用。', 'error');
    state.loading = false;
    state.readOnly = true;
    render();
    return;
  }
  try {
    const [catsResult, prods] = await Promise.all([
      _supabaseClient.from('categories').select('*'),
      (async () => {
        let allProds = []; let from = 0, pageSize = 1000;
        const supabaseUrl = 'https://xbevlbuhrnzmtfmseqsj.supabase.co';
        const supabaseKey = 'sb_publishable_hclTTu_Tn46Z8l3FG2U9mQ_jSXr7wl-';
        while (true) {
          const res = await fetch(supabaseUrl + '/rest/v1/products?select=*&order=id.asc&offset=' + from + '&limit=' + pageSize,
            { headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey } });
          if (!res.ok) throw new Error('products fetch status=' + res.status);
          const batch = await res.json();
          if (batch && batch.length) allProds = allProds.concat(batch);
          if (!batch || batch.length < pageSize) break;
          from += pageSize;
        }
        return allProds;
      })()
    ]);
    const cats = catsResult?.data;
    if (catsResult?.error) throw catsResult.error;
    if (cats && cats.length && Array.isArray(prods)) {
      state.categories = cats;
      state.products = prods;
      console.log('[KRN后台版本2026-08-14-2200] 已加载产品总数:', prods.length);
      initCategoryAndKind();
    } else {
      throw new Error('数据格式异常: cats=' + !!cats + ' prods=' + (Array.isArray(prods) ? prods.length : typeof prods));
    }
  } catch (e) {
    console.error(e);
    showMessage('数据库连接失败：' + e.message + '，已切换到内嵌示例数据（只读）', 'error');
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products;
    initCategoryAndKind();
    state.readOnly = true;
  }
  state.loading = false;
  render();
}

function initCategoryAndKind() {
  if (!state.categories.length) return;
  const cat = state.categories.find(c => c.id === state.currentCategoryId) || state.categories[0];
  state.currentCategoryId = cat.id;
  const kinds = cat.kinds_config?.kinds || [];
  state.currentKindKey = kinds.length ? kinds[0].key : '';
}

function getCategory() {
  return state.categories.find(c => c.id === state.currentCategoryId) || state.categories[0];
}
function getKinds() {
  return getCategory()?.kinds_config?.kinds || [];
}
function getCurrentKind() {
  return getKinds().find(k => k.key === state.currentKindKey) || getKinds()[0];
}
function getFilteredProducts() {
  return state.products.filter(p => p.category === state.currentCategoryId && p.kind === state.currentKindKey);
}

function showMessage(text, type) {
  state.message = text;
  state.messageType = type;
  render();
  setTimeout(() => { state.message = null; render(); }, 4000);
}

// ==================== 登录 ====================
function login(password) {
  // 兼容无参调用(HTML onclick/onkeydown 调用时不传参)
  if (password === undefined) {
    const input = document.getElementById('pwd');
    password = input ? input.value : '';
  }
  if (password === ADMIN_PASSWORD) {
    state.loggedIn = true;
    sessionStorage.setItem('krn_admin_login', '1');
    loadData();
  } else {
    showMessage('密码错误', 'error');
    render();
  }
}
function logout() {
  state.loggedIn = false;
  sessionStorage.removeItem('krn_admin_login');
  render();
}

// ==================== 产品 CRUD ====================
function openAddModal() {
  const kind = getCurrentKind();
  if (!kind) return;
  state.modal = {
    mode: 'add',
    product: {
      category: state.currentCategoryId,
      kind: kind.key,
      model: '',
      manufacturer: '',
      price: '',
      datasheet_url: '',
      image_url: '',
      remarks: '',
      spec_data: {}
    }
  };
  render();
  setTimeout(() => { const el = document.getElementById('modelInput'); if (el) el.focus(); }, 10);
}
function openEditModal(product) {
  state.modal = {
    mode: 'edit',
    product: { ...product, spec_data: { ...product.spec_data } }
  };
  render();
  setTimeout(() => { const el = document.getElementById('modelInput'); if (el) el.focus(); }, 10);
}
function closeModal() {
  state.modal = null;
  render();
}
function updateSpecField(key, value) {
  state.modal.product.spec_data[key] = value;
}
function updateProductField(key, value) {
  state.modal.product[key] = value;
}
async function saveProduct() {
  const p = state.modal.product;
  if (!p.model || !p.manufacturer) {
    showMessage('型号和制造商为必填项', 'error');
    return;
  }
  if (state.readOnly || !_supabaseClient) {
    showMessage('当前为只读模式，无法保存', 'error');
    return;
  }
  const payload = {
    category: p.category,
    kind: p.kind,
    model: p.model,
    manufacturer: p.manufacturer,
    spec_data: p.spec_data,
    price: p.price,
    datasheet_url: p.datasheet_url,
    image_url: p.image_url,
    remarks: p.remarks
  };
  try {
    if (state.modal.mode === 'add') {
      const { error } = await _supabaseClient.from('products').insert(payload);
      if (error) throw error;
      showMessage('添加成功', 'success');
    } else {
      const { error } = await _supabaseClient.from('products').update(payload).eq('id', p.id);
      if (error) throw error;
      showMessage('更新成功', 'success');
    }
    state.modal = null;
    await loadData();
  } catch (e) {
    showMessage('保存失败：' + e.message, 'error');
  }
}
async function deleteProduct(id) {
  if (!confirm('确定删除这条产品？')) return;
  if (state.readOnly || !_supabaseClient) {
    showMessage('当前为只读模式，无法删除', 'error');
    return;
  }
  try {
    const { error } = await _supabaseClient.from('products').delete().eq('id', id);
    if (error) throw error;
    showMessage('删除成功', 'success');
    await loadData();
  } catch (e) {
    showMessage('删除失败：' + e.message, 'error');
  }
}

  state.modal = { mode: 'bulk', rows: null, parsed: [] };

  const m = state.modal;
  const kind = getCurrentKind();
  return `

async function handleBulkFile(file) {
  if (!file) return;
  const area = document.getElementById('bulkUploadArea');
  const resultEl = document.getElementById('bulkParseResult');
  const confirmBtn = document.getElementById('bulkConfirmBtn');
  area.innerHTML = `<div>已选择：${escapeHtml(file.name)}</div><div class="upload-hint">正在解析...</div>`;
  try {
    let text;
    if (file.name.toLowerCase().endsWith('.csv')) {
      text = await file.text();
    } else {
      throw new Error('目前仅支持 .csv 文件，请将 Excel 另存为 CSV(UTF-8) 后上传');
    }
    const rows = parseCsv(text);
    if (!rows.length) throw new Error('文件为空或解析失败');
    state.modal.parsed = rows;
    state.modal.fileName = file.name;
    resultEl.innerHTML = renderParsePreview(rows);
    confirmBtn.disabled = false;
    area.innerHTML = `<div>已选择：${escapeHtml(file.name)}</div><div class="upload-hint">共解析 ${rows.length} 行数据</div>`;
  } catch (e) {
    area.innerHTML = `<div style="color:#ff4d4f">解析失败：${escapeHtml(e.message)}</div><div class="upload-hint">点击重新选择文件</div>`;
    resultEl.innerHTML = '';
    confirmBtn.disabled = true;
  }
}

function parseCsv(text) {
  // Simple CSV parser handling quoted fields
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = parseCsvLine(lines[0]).map(h => h.trim());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    if (cols.length < 2) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h] = (cols[idx] || '').trim(); });
    rows.push(row);
  }
  return rows;
}

function parseCsvLine(line) {
  const cols = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') {
        if (line[i + 1] === '"') { current += '"'; i++; }
        else { inQuotes = false; }
      } else { current += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { cols.push(current); current = ''; }
      else { current += c; }
    }
  }
  cols.push(current);
  return cols;
}

function renderParsePreview(rows) {
  if (!rows.length) return '';
  const keys = Object.keys(rows[0]);
  return `
    <div style="margin-bottom:8px;font-size:13px;color:#666;">解析预览（前5行）：</div>
    <div class="parse-preview">
      <table>
        <thead><tr>${keys.map(k => `<th>${escapeHtml(k)}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.slice(0, 5).map(r => `<tr>${keys.map(k => `<td>${escapeHtml(r[k])}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function normalizeHeader(h) {
  return h.replace(/\s+/g, '').replace(/[()（）\[\]]/g, '').toLowerCase();
}

function getKindFieldMap() {
  const kind = getCurrentKind();
  const map = {
    '型号': 'model',
    '制造商': 'manufacturer',
    '参考价格': 'price',
    '数据手册链接': 'datasheet_url',
    '图片链接': 'image_url',
    '备注': 'remarks'
  };
  kind.filters.forEach(f => { map[f.name] = f.key; });
  return map;
}

function rowToProduct(row, categoryId, kindKey) {
  const fieldMap = getKindFieldMap();
  const specKeys = Object.keys(fieldMap).filter(k => !['型号', '制造商', '参考价格', '数据手册链接', '图片链接', '备注'].includes(k));
  const spec_data = {};
  specKeys.forEach(headerName => {
    const key = fieldMap[headerName];
    // Try exact header first, then normalized
    let val = row[headerName];
    if (val === undefined) {
      const norm = normalizeHeader(headerName);
      const matched = Object.keys(row).find(h => normalizeHeader(h) === norm);
      if (matched !== undefined) val = row[matched];
    }
    if (val) spec_data[key] = val;
  });
  const model = row['型号'] || row[Object.keys(row).find(h => normalizeHeader(h) === '型号')] || '';
  const manufacturer = row['制造商'] || row[Object.keys(row).find(h => normalizeHeader(h) === '制造商')] || '';
  return {
    category: categoryId,
    kind: kindKey,
    model: model,
    manufacturer: manufacturer,
    spec_data: spec_data,
    price: row['参考价格'] || row[Object.keys(row).find(h => normalizeHeader(h) === '参考价格')] || '',
    datasheet_url: row['数据手册链接'] || row[Object.keys(row).find(h => normalizeHeader(h) === '数据手册链接')] || '',
    image_url: row['图片链接'] || row[Object.keys(row).find(h => normalizeHeader(h).includes('图片'))] || '',
    remarks: row['备注'] || row[Object.keys(row).find(h => normalizeHeader(h) === '备注')] || ''
  };
}

async function confirmBulkUpload() {
  const rows = state.modal.parsed || [];
  if (!rows.length) return;
  if (state.readOnly || !_supabaseClient) {
    showMessage('当前为只读模式，无法上传', 'error');
    return;
  }
  const products = rows.map(r => rowToProduct(r, state.currentCategoryId, state.currentKindKey)).filter(p => p.model && p.manufacturer);
  if (!products.length) {
    showMessage('没有有效的产品数据（型号和制造商为必填）', 'error');
    return;
  }
  try {
    const { error } = await _supabaseClient.from('products').insert(products);
    if (error) throw error;
    showMessage(`成功上传 ${products.length} 条产品`, 'success');
    state.modal = null;
    await loadData();
  } catch (e) {
    showMessage('批量上传失败：' + e.message, 'error');
  }
}

function downloadUploadTemplate() {
  const kind = getCurrentKind();
  const headers = ['型号', '制造商', ...kind.filters.map(f => f.name), '参考价格', '数据手册链接', '图片链接', '备注'];
  const example = headers.map(h => {
    if (h === '型号') return 'XC6206P332MR';
    if (h === '制造商') return 'TOREX';
    if (h === '参考价格') return '0.12';
    if (h === '数据手册链接') return 'https://example.com/datasheet.pdf';
    if (h === '图片链接') return 'https://example.com/image.jpg';
    if (h === '备注') return '现货';
    return '';
  });
  const csv = [headers.join(','), example.join(',')].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `上传模板_${state.currentCategoryId}_${state.currentKindKey}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);
}

// Setup drag and drop for bulk upload area after render
function bindBulkUploadEvents() {
  const area = document.getElementById('bulkUploadArea');
  const input = document.getElementById('bulkFileInput');
  if (!area) return;
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleBulkFile(file);
  });
}

// ==================== 渲染 ====================
function render() {
  const app = document.getElementById('app');
  if (!state.loggedIn) {
    app.innerHTML = renderLogin();
    return;
  }
  app.innerHTML = renderAdmin();
  bindAdminEvents();
  bindBulkUploadEvents();
}

function renderLogin() {
  return `
    <div class="login-box">
      <h2>KRN科瑞诺后台管理</h2>
      ${state.message ? `<div class="error-msg">${state.message}</div>` : ''}
      <input type="password" id="pwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter') login()">
      <button class="btn btn-primary" onclick="login()">登录</button>
    </div>
  `;
}

function renderAdmin() {
  return `
    <div class="wrap">
      <header>
        <div>
          <h1>KRN科瑞诺参数筛选器 - 后台管理</h1>
          <p>管理产品型号、制造商、参数与价格</p>
        </div>
        <button class="btn btn-default" onclick="logout()">退出登录</button>
      </header>
      ${state.message ? `<div class="status-tip ${state.messageType}">${state.message}</div>` : ''}
      <div class="cat-bar">
        ${state.categories.map(cat => {
          const active = cat.id === state.currentCategoryId ? 'active' : '';
          return `<button class="cat-btn ${active}" data-id="${cat.id}">${cat.display_name}</button>`;
        }).join('')}
      </div>
      <div class="panel">
        ${state.loading ? '<div class="loading">正在加载数据...</div>' : renderKindPanel()}
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}

const ADMIN_PAGE_SIZE = 10;

function renderKindPanel() {
  const kinds = getKinds();
  const kind = getCurrentKind();
  if (!kind) return '<div class="empty-state">当前分类没有配置子类型</div>';
  const allProducts = getFilteredProducts();
  const count = allProducts.length;
  const totalPages = Math.ceil(count / ADMIN_PAGE_SIZE);
  // 页码越界修正
  if (state.currentPage > totalPages) state.currentPage = Math.max(1, totalPages);
  if (state.currentPage < 1) state.currentPage = 1;
  const startIdx = (state.currentPage - 1) * ADMIN_PAGE_SIZE;
  const pageProducts = allProducts.slice(startIdx, startIdx + ADMIN_PAGE_SIZE);

  let html = `
    ${kinds.length > 1 ? `
      <div class="kind-bar">
        ${kinds.map(k => {
          const active = k.key === state.currentKindKey ? 'active' : '';
          return `<button class="kind-btn ${active}" data-key="${k.key}">${k.name}</button>`;
        }).join('')}
      </div>
    ` : ''}
    <div class="toolbar">
      <div><strong>${kind.name}</strong>（共 ${count} 条）</div>
      <div class="bulk-actions">
        <button class="btn btn-default" onclick="downloadUploadTemplate()">📥 下载上传模板</button>
        <button class="btn btn-default" onclick="openBulkUploadModal()">📤 表格批量上传</button>
        <button class="btn btn-primary" onclick="openAddModal()">+ 添加型号</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>图片</th><th>型号</th><th>制造商</th>${kind.filters.map(f => `<th>${escapeHtml(f.name)}</th>`).join('')}<th>参考价格</th><th>数据手册</th><th>备注</th><th>操作</th></tr>
        </thead>
        <tbody>
          ${pageProducts.length ? pageProducts.map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${p.image_url ? `<img class="prod-img-preview" src="${escapeHtml(p.image_url)}" alt="">` : '-'}</td>
              <td>${escapeHtml(p.model)}</td>
              <td>${escapeHtml(p.manufacturer)}</td>
              ${kind.filters.map(f => `<td>${escapeHtml(p.spec_data?.[f.key] || '-')}</td>`).join('')}
              <td>${escapeHtml(p.price || '-')}</td>
              <td>${p.datasheet_url ? `<a href="${escapeHtml(p.datasheet_url)}" target="_blank">链接</a>` : '-'}</td>
              <td>${escapeHtml(p.remarks || '-')}</td>
              <td class="actions">
                <button class="btn btn-primary" onclick="openEditModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">编辑</button>
                <button class="btn btn-danger" onclick="deleteProduct(${p.id})">删除</button>
              </td>
            </tr>
          `).join('') : `<tr><td colspan="${6 + kind.filters.length}" class="empty-state">该子类型下暂无产品</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  // 分页控件
  if (totalPages > 1) {
    html += buildAdminPaginationHTML(totalPages);
  }

  return html;
}

function buildAdminPaginationHTML(totalPages) {
  const cp = state.currentPage;
  let btns = [];

  btns.push(`<button data-page="${cp - 1}" ${cp <= 1 ? 'disabled' : ''}>上一页</button>`);

  const pages = [];
  pages.push(1);
  for (let i = Math.max(2, cp - 2); i <= Math.min(totalPages - 1, cp + 2); i++) {
    if (pages[pages.length - 1] !== i) pages.push(i);
  }
  if (totalPages > 1 && pages[pages.length - 1] !== totalPages) pages.push(totalPages);

  const display = [];
  for (let i = 0; i < pages.length; i++) {
    if (i > 0 && pages[i] - pages[i-1] > 1) display.push('...');
    display.push(pages[i]);
  }

  display.forEach(item => {
    if (item === '...') {
      btns.push(`<span class="ellipsis">...</span>`);
    } else {
      btns.push(`<button data-page="${item}" ${item === cp ? 'class="active"' : ''}>${item}</button>`);
    }
  });

  btns.push(`<button data-page="${cp + 1}" ${cp >= totalPages ? 'disabled' : ''}>下一页</button>`);

  return `<div class="pagination">${btns.join('')}</div>`;
}

function renderModal() {
  if (state.modal && state.modal.mode === 'bulk') return renderBulkUploadModal();
  const p = state.modal.product;
  const kind = getCurrentKind();
  const title = state.modal.mode === 'add' ? '添加型号' : '编辑型号';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label>型号 *</label>
              <input type="text" id="modelInput" value="${escapeHtml(p.model)}" oninput="updateProductField('model', this.value)">
            </div>
            <div class="form-group">
              <label>制造商 *</label>
              <input type="text" value="${escapeHtml(p.manufacturer)}" oninput="updateProductField('manufacturer', this.value)">
            </div>
          </div>
          <div class="form-row">
            ${kind.filters.map(f => `
              <div class="form-group">
                <label>${escapeHtml(f.name)}</label>
                <input type="text" value="${escapeHtml(p.spec_data?.[f.key] || '')}" oninput="updateSpecField('${f.key}', this.value)">
              </div>
            `).join('')}
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>参考价格</label>
              <input type="text" value="${escapeHtml(p.price)}" oninput="updateProductField('price', this.value)">
            </div>
            <div class="form-group">
              <label>数据手册链接</label>
              <input type="text" value="${escapeHtml(p.datasheet_url)}" oninput="updateProductField('datasheet_url', this.value)">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>产品图片链接</label>
              <input type="text" value="${escapeHtml(p.image_url)}" oninput="updateProductField('image_url', this.value)" placeholder="https://...">
            </div>
            <div class="form-group">
              <label>备注</label>
              <input type="text" value="${escapeHtml(p.remarks)}" oninput="updateProductField('remarks', this.value)">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveProduct()">保存</button>
        </div>
      </div>
    </div>
  `;
}

function bindAdminEvents() {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentCategoryId = btn.dataset.id;
      state.currentPage = 1;
      initCategoryAndKind();
      render();
    });
  });
  document.querySelectorAll('.kind-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentKindKey = btn.dataset.key;
      state.currentPage = 1;
      render();
    });
  });
  // 分页点击事件
  document.querySelectorAll('.pagination button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = parseInt(btn.dataset.page);
      if (!isNaN(page)) {
        state.currentPage = page;
        render();
        // 滚动到表格区域
        const tableWrap = document.querySelector('.table-wrap');
        if (tableWrap) tableWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

init();
</script>
