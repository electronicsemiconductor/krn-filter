// ==================== 状态 ====================
let appState = {
  categories: [],
  products: [],
  currentCategoryId: 'power',
  currentKindKey: '',
  selectedFilters: {}, // { [filterKey]: Set }
  searchTerms: {},     // { [filterKey]: string }
  loading: true,
  error: null,
  currentPage: 1
};

// ==================== 初始化 ====================
async function init() {
  // 先用内嵌数据渲染，确保页面不空白
  appState.categories = FALLBACK_DATA.categories;
  appState.products = FALLBACK_DATA.products;
  appState.loading = false;
  initCategoryAndKind();
  renderAll();

  // 异步尝试从 Supabase 加载最新数据
  // 若 SDK 使用 defer 加载，可能此时 window.supabase 还未就绪，需要等待
  if (!_supabaseClient) {
    for (let i = 0; i < 30; i++) { // 最多等 3 秒
      await new Promise(r => setTimeout(r, 100));
      if (initSupabaseClient()) break;
      if (window.__supabaseLoadFailed) break;
    }
  }

  if (_supabaseClient) {
    try {
      const [{ data: cats, error: err1 }, { data: prods, error: err2 }] = await Promise.all([
        _supabaseClient.from('categories').select('*'),
        // Supabase 免费版单次查询上限 1000 条，用原生 fetch 分页循环获取全部产品
        (async () => {
          let allProds = [];
          let from = 0, pageSize = 1000;
          const supabaseUrl = 'https://xbevlbuhrnzmtfmseqsj.supabase.co';
          const supabaseKey = 'sb_publishable_hclTTu_Tn46Z8l3FG2U9mQ_jSXr7wl-';
          while (true) {
            const res = await fetch(
              supabaseUrl + '/rest/v1/products?select=*&order=id.asc&offset=' + from + '&limit=' + pageSize,
              { headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey } }
            );
            if (!res.ok) throw new Error('products fetch status=' + res.status);
            const batch = await res.json();
            if (batch && batch.length) allProds = allProds.concat(batch);
            if (!batch || batch.length < pageSize) break;
            from += pageSize;
          }
          return allProds;
        })()
      ]);
      if (err1) throw err1;
      if (err2) throw err2;
      if (cats && cats.length && prods) {
        appState.categories = cats;
        appState.products = prods;
        initCategoryAndKind();
        appState.selectedFilters = {};
        appState.searchTerms = {};
        renderAll();
      } else {
      }
    } catch (e) {
      console.error('Supabase 加载失败:', e);
    }
  } else if (window.__supabaseLoadFailed) {
    console.error('Supabase SDK 加载失败（CDN 不可达）');
  } else {
    console.error('Supabase SDK 未就绪（超时 3 秒）');
  }
}

function initCategoryAndKind() {
  if (!appState.categories.length) return;
  const cat = appState.categories.find(c => c.id === appState.currentCategoryId) || appState.categories[0];
  appState.currentCategoryId = cat.id;
  const kinds = cat.kinds_config?.kinds || [];
  appState.currentKindKey = kinds.length ? kinds[0].key : '';
  appState.selectedFilters = {};
  appState.searchTerms = {};
  appState.currentPage = 1;
}

function getCategory() {
  return appState.categories.find(c => c.id === appState.currentCategoryId) || appState.categories[0];
}

function getKinds() {
  const cat = getCategory();
  return cat?.kinds_config?.kinds || [];
}

function getCurrentKind() {
  return getKinds().find(k => k.key === appState.currentKindKey) || getKinds()[0];
}

// ==================== 渲染 ====================
function renderAll() {
  if (appState.loading) {
    document.getElementById('catBar').innerHTML = '<div class="loading">正在加载数据...</div>';
    document.getElementById('filters').innerHTML = '';
    document.getElementById('results').innerHTML = '';
    return;
  }
  renderCatBar();
  renderFilters();
  renderResults();
}

function renderCatBar() {
  const bar = document.getElementById('catBar');
  bar.innerHTML = appState.categories.map(cat => {
    const active = cat.id === appState.currentCategoryId ? 'active' : '';
    return `<button class="cat-btn ${active}" data-id="${cat.id}">${cat.display_name}</button>`;
  }).join('');
  bar.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      appState.currentCategoryId = btn.dataset.id;
      initCategoryAndKind();
      renderAll();
    });
  });
}

function renderFilters() {
  const panel = document.getElementById('filters');
  const kinds = getKinds();
  const currentKind = getCurrentKind();
  if (!currentKind) {
    panel.innerHTML = '<div class="empty-state">暂无筛选配置</div>';
    return;
  }

  let html = '';
  // 子类型切换（仅当分类下存在多个子类型时显示）
  if (kinds.length > 1) {
    html += `<div class="kind-bar">` + kinds.map(k => {
      const active = k.key === appState.currentKindKey ? 'active' : '';
      return `<button class="kind-btn ${active}" data-key="${k.key}">${k.name}</button>`;
    }).join('') + `</div>`;
  }

  // 动态筛选列 — 横向并排容器
  html += `<div class="filter-row">`;
  // 动态筛选列
  currentKind.filters.forEach(filter => {
    const options = getFilterOptions(filter.key);
    const selected = appState.selectedFilters[filter.key] || new Set();
    const searchTerm = appState.searchTerms[filter.key] || '';
    const filteredOptions = options.filter(o => o.toLowerCase().includes(searchTerm.toLowerCase()));

    html += `
      <div class="filter-section">
        <div class="filter-title">
          <span>${filter.name}</span>
          <span class="reset" data-key="${filter.key}">重置</span>
        </div>
        <input type="text" class="filter-search" placeholder="搜索..." data-key="${filter.key}" value="${escapeHtml(searchTerm)}">
        <div class="filter-options">
          ${filteredOptions.map(opt => `
            <label class="filter-option">
              <input type="checkbox" data-key="${filter.key}" value="${escapeHtml(opt)}" ${selected.has(opt) ? 'checked' : ''}>
              <span>${escapeHtml(opt)}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += `</div>`;

  panel.innerHTML = html;

  // 子类型切换事件
  panel.querySelectorAll('.kind-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      appState.currentKindKey = btn.dataset.key;
      appState.selectedFilters = {};
      appState.searchTerms = {};
      appState.currentPage = 1;
      renderAll();
    });
  });

  // 筛选事件
  panel.querySelectorAll('.filter-option input').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.dataset.key;
      const val = cb.value;
      if (!appState.selectedFilters[key]) appState.selectedFilters[key] = new Set();
      if (cb.checked) appState.selectedFilters[key].add(val);
      else appState.selectedFilters[key].delete(val);
      appState.currentPage = 1;
      renderAll(); // 重新渲染筛选面板，让其他列联动收窄
    });
  });

  // 搜索事件
  panel.querySelectorAll('.filter-search').forEach(input => {
    input.addEventListener('input', () => {
      appState.searchTerms[input.dataset.key] = input.value;
      renderFilters(); // 重新渲染当前列选项
    });
  });

  // 重置列事件
  panel.querySelectorAll('.filter-title .reset').forEach(btn => {
    btn.addEventListener('click', () => {
      delete appState.selectedFilters[btn.dataset.key];
      appState.currentPage = 1;
      renderAll();
    });
  });
}

// 返回满足「除 excludeKey 外所有已选筛选条件」的产品子集（级联联动核心）
function getProductsMatchingOthers(excludeKey) {
  const currentKind = getCurrentKind();
  let products = appState.products.filter(p =>
    p.category === appState.currentCategoryId && p.kind === appState.currentKindKey
  );
  Object.keys(appState.selectedFilters).forEach(key => {
    if (key === excludeKey) return; // 跳过自身，避免本列选择影响本列可选值
    const selected = appState.selectedFilters[key];
    if (selected && selected.size) {
      products = products.filter(p => {
        const v = p.spec_data?.[key];
        return v !== undefined && selected.has(String(v));
      });
    }
  });
  return products;
}

// 某列的可选值 = 满足其他已选条件的产品子集，在该维度上的去重值
// 已勾选的值始终保留显示，避免用户选择突然消失
function getFilterOptions(filterKey) {
  const products = getProductsMatchingOthers(filterKey);
  const values = new Set();
  products.forEach(p => {
    const v = p.spec_data?.[filterKey];
    if (v !== undefined && v !== null && v !== '') values.add(String(v));
  });
  // 始终保留本列已选中的值（即使因其他列变化导致它暂时不共存）
  const selected = appState.selectedFilters[filterKey];
  if (selected) selected.forEach(v => values.add(v));
  return Array.from(values).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
}

const PAGE_SIZE = 10;

function renderResults() {
  const panel = document.getElementById('results');
  const currentKind = getCurrentKind();
  if (!currentKind) {
    panel.innerHTML = '<div class="empty-state">暂无产品数据</div>';
    return;
  }

  let products = appState.products.filter(p =>
    p.category === appState.currentCategoryId && p.kind === appState.currentKindKey
  );

  // 应用筛选
  Object.keys(appState.selectedFilters).forEach(key => {
    const selected = appState.selectedFilters[key];
    if (selected && selected.size) {
      products = products.filter(p => {
        const v = p.spec_data?.[key];
        return v !== undefined && selected.has(String(v));
      });
    }
  });

  const count = products.length;
  const totalPages = Math.ceil(count / PAGE_SIZE);
  // 页码越界修正
  if (appState.currentPage > totalPages) appState.currentPage = Math.max(1, totalPages);
  if (appState.currentPage < 1) appState.currentPage = 1;
  const startIdx = (appState.currentPage - 1) * PAGE_SIZE;
  const pageProducts = products.slice(startIdx, startIdx + PAGE_SIZE);

  let html = `
    <div class="results-bar">
      <div class="results-count">共 <strong>${count}</strong> 个型号匹配</div>
      <div class="clear-all" id="clearAll">清空全部筛选</div>
    </div>
  `;

  if (count === 0) {
    html += `<div class="empty-state">没有符合条件的型号，请调整筛选条件</div>`;
  } else {
    html += `<div style="overflow-x:auto;"><table class="results-table"><thead><tr>`;
    html += `<th>图片</th><th>型号</th><th>制造商</th>`;
    currentKind.filters.forEach(f => {
      html += `<th>${escapeHtml(f.name)}</th>`;
    });
    html += `<th>参考价格</th><th>数据手册</th><th>备注</th></tr></thead><tbody>`;

    pageProducts.forEach(p => {
      html += `<tr>`;
      if (p.image_url) {
        html += `<td><img class="prod-img-thumb" src="${escapeHtml(p.image_url)}" alt="" onclick="openLightbox('${escapeHtml(p.image_url)}')"></td>`;
      } else {
        html += `<td><div class="prod-img-placeholder">暂无</div></td>`;
      }
      html += `<td class="model">${escapeHtml(p.model)}</td><td>${escapeHtml(p.manufacturer)}</td>`;
      currentKind.filters.forEach(f => {
        const v = p.spec_data?.[f.key] || '-';
        html += `<td>${escapeHtml(v)}</td>`;
      });
      html += `<td class="price">¥${escapeHtml(p.price || '-')}</td>`;
      if (p.datasheet_url) {
        html += `<td><a class="datasheet-link" href="${escapeHtml(p.datasheet_url)}" target="_blank">📄 数据手册</a></td>`;
      } else {
        html += `<td><span class="datasheet-icon-disabled">📄 数据手册</span></td>`;
      }
      html += `<td class="remarks-cell">${escapeHtml(p.remarks || '-')}</td>`;
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;

    // 分页控件
    if (totalPages > 1) {
      html += buildPaginationHTML(totalPages);
    }
  }

  panel.innerHTML = html;

  // 绑定事件
  const clearAllBtn = document.getElementById('clearAll');
  if (clearAllBtn) clearAllBtn.addEventListener('click', () => {
    appState.selectedFilters = {};
    appState.searchTerms = {};
    appState.currentPage = 1;
    renderAll();
  });

  // 绑定分页点击
  panel.querySelectorAll('.pagination button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = parseInt(btn.dataset.page);
      if (!isNaN(page)) {
        appState.currentPage = page;
        renderResults();
        // 滚动到结果区域顶部
        document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
}

function buildPaginationHTML(totalPages) {
  const cp = appState.currentPage;
  let btns = [];

  // 上一页
  btns.push(`<button data-page="${cp - 1}" ${cp <= 1 ? 'disabled' : ''}>上一页</button>`);

  // 页码逻辑：始终显示第1页、最后1页、当前页及其前后各2页
  const pages = [];
  pages.push(1);
  for (let i = Math.max(2, cp - 2); i <= Math.min(totalPages - 1, cp + 2); i++) {
    if (pages[pages.length - 1] !== i) pages.push(i);
  }
  if (totalPages > 1 && pages[pages.length - 1] !== totalPages) pages.push(totalPages);

  // 添加省略号标记
  const display = [];
  for (let i = 0; i < pages.length; i++) {
    if (i > 0 && pages[i] - pages[i-1] > 1) display.push('...');
    display.push(pages[i]);
  }

  display.forEach(item => {
    if (item === '...') {
      btns.push(`<span class="ellipsis">...</span>`);
    } else {
      btns.push(`<button data-page="${item}" ${item === cp ? 'class="active"' : ''}>${item}</button>`);
    }
  });

  // 下一页
  btns.push(`<button data-page="${cp + 1}" ${cp >= totalPages ? 'disabled' : ''}>下一页</button>`);

  return `<div class="pagination">${btns.join('')}</div>`;
}


function openLightbox(url) {
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${escapeHtml(url)}" alt="产品图片">`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
