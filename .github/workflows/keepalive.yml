name: Supabase Keep-Alive

on:
  schedule:
    # 每 5 天跑一次（UTC 04:17），小于 7 天暂停窗口
    - cron: '17 4 */5 * *'
  workflow_dispatch: {}

# 允许 workflow 自身往仓库提交（自活跃）
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping all Supabase projects
        id: ping
        continue-on-error: true  # ← ping 失败不阻断后续步骤
        run: |
          declare -a PROJECTS=(
            "https://xbevlbuhrnzmtfmseqsj.supabase.co|sb_publishable_hclTTu_Tn46Z8l3FG2U9mQ_jSXr7wl-"
            "https://jlrfqsxrlmvmeobscgoh.supabase.co|sb_publishable_XhbkwG-rBTVHRVZxxm0Q4g_EhFFnx6v"
            "https://qlxffqldjzfnmhvtazuo.supabase.co|sb_publishable_v8Izejn2bfY6RUUozBlDvg_MDkan1Pd"
            "https://xafihsvikmiiauszkstq.supabase.co|sb_publishable_eVwVm1npRqA1k3gFkn4whA_2DD-drVZ"
            "https://koaifvgkjakaiiodiyyg.supabase.co|sb_publishable_MPzPeNT3vjjLDlAChNqAUg_ehqMT3RQ"
          )
          FAIL=0
          for entry in "${PROJECTS[@]}"; do
            url="${entry%%|*}"
            key="${entry##*|}"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              "${url}/rest/v1/products?select=id&limit=1")
            echo "$(date -u) ${url} -> HTTP ${code}"
            [ "$code" = "200" ] || FAIL=1
          done
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"

      - name: Keep repo active (提交心跳时间戳)  # ← 无论 ping 成败都执行
        run: |
          date -u > last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-ping.txt
          git commit -m "ci: keepalive ping $(date -u)" || echo "nothing to commit"
          git push

      - name: 报告 ping 结果
        run: |
          if [ "${{ steps.ping.outputs.fail }}" = "1" ]; then
            echo "::warning::有 Supabase 项目未返回 HTTP 200，可能已被暂停，请到 Dashboard 检查并 Resume"
          else
            echo "::notice::所有 Supabase 项目 ping 正常 ✓"
          fi
